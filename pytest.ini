[pytest]
addopts = -ra -q --tb=short --strict-markers --cov=qt_stylehelper --cov-report=html
testpaths =
  tests
  qt_stylehelper
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
  slow: marks tests as slow (deselect with '-m "not slow"')
  qt: marks Qt-related tests
  integration: marks integration-level tests
